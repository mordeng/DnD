name: Build and Deploy Wiki

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: .wiki-build

      - name: Build wiki
        run: node .wiki-build/build.js

      - name: Verify build output
        run: |
          echo "=== Build Output Structure ==="
          ls -la wiki-output/
          echo ""
          echo "=== Assets Directory ==="
          ls -la wiki-output/assets/
          echo ""
          echo "=== CSS Files ==="
          ls -la wiki-output/assets/css/ || echo "No CSS directory"
          echo ""
          echo "=== JS Files ==="
          ls -la wiki-output/assets/js/ || echo "No JS directory"
          echo ""
          echo "=== Image Files ==="
          ls -la wiki-output/assets/images/ | head -20 || echo "No images directory"

      - name: Create .nojekyll file
        run: touch wiki-output/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './wiki-output'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
