name: Test Wiki

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Job 1: Build and Content Tests
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '.wiki-build/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: .wiki-build

      - name: Build wiki
        run: npm run build
        working-directory: .wiki-build

      - name: Run automated tests
        run: npm test
        working-directory: .wiki-build

      - name: Upload build artifacts for testing
        uses: actions/upload-artifact@v4
        with:
          name: wiki-build
          path: wiki-output/
          retention-days: 7

  # Job 2: Lighthouse CI - Performance & Accessibility
  lighthouse:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wiki-build
          path: wiki-output/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install http-server
        run: npm install -g http-server

      - name: Start local server
        run: |
          http-server wiki-output -p 8080 &
          sleep 5

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:8080/
            http://localhost:8080/characters/
            http://localhost:8080/sessions/
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

      - name: Check Lighthouse scores
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:8080/
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3
          configPath: './.github/lighthouse/lighthouserc.json'

  # Job 3: Link Checker
  link-checker:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wiki-build
          path: wiki-output/

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress './wiki-output/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  # Job 4: HTML Validation
  html-validation:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wiki-build
          path: wiki-output/

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: wiki-output/
          css: false

  # Job 5: Accessibility Testing (Pa11y)
  accessibility:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wiki-build
          path: wiki-output/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install http-server and pa11y-ci
        run: |
          npm install -g http-server pa11y-ci

      - name: Start local server
        run: |
          http-server wiki-output -p 8080 &
          sleep 5

      - name: Run Pa11y accessibility tests
        run: |
          pa11y-ci \
            --sitemap http://localhost:8080/sitemap.xml \
            --sitemap-find http://localhost:8080 \
            --sitemap-replace http://localhost:8080 \
            || true

      - name: Run accessibility spot checks
        run: |
          pa11y http://localhost:8080/ || true
          pa11y http://localhost:8080/characters/ || true

  # Job 6: Security Scan
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Summary Job
  test-summary:
    runs-on: ubuntu-latest
    needs: [build-and-test, lighthouse, link-checker, html-validation, accessibility]
    if: always()

    steps:
      - name: Test Summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Content Tests | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse CI | ${{ needs.lighthouse.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Link Checker | ${{ needs.link-checker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HTML Validation | ${{ needs.html-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility Tests | ${{ needs.accessibility.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status**: All tests completed!" >> $GITHUB_STEP_SUMMARY
