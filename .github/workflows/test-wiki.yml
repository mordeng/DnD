name: Test Wiki

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Job 1: Build and Content Tests
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd .wiki-build
          npm install

      - name: Build wiki
        run: |
          cd .wiki-build
          npm run build

      - name: Run automated tests
        run: |
          cd .wiki-build
          npm test
        continue-on-error: true

      - name: Upload build artifacts for testing
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiki-build
          path: wiki-output/
          retention-days: 7

  # Job 2: Lighthouse CI - Performance & Accessibility (Optional)
  lighthouse:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: success() || failure()
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wiki-build
          path: wiki-output/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install http-server
        run: npm install -g http-server

      - name: Start local server
        run: |
          http-server wiki-output -p 8080 &
          sleep 10

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        continue-on-error: true
        with:
          urls: |
            http://localhost:8080/
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 1

  # Summary Job
  test-summary:
    runs-on: ubuntu-latest
    needs: [build-and-test, lighthouse]
    if: always()

    steps:
      - name: Test Summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Content Tests | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse CI (Optional) | ${{ needs.lighthouse.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status**: Tests completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Primary test (build-and-test):** ${{ needs.build-and-test.result }}" >> $GITHUB_STEP_SUMMARY
