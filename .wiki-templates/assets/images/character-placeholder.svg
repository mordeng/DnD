<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Parchment background -->
  <rect width="300" height="400" fill="#f0e6d2"/>
  <rect width="300" height="400" fill="url(#parchment)" opacity="0.3"/>
  
  <defs>
    <pattern id="parchment" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#e8d8c0" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Simple character silhouette -->
  <circle cx="150" cy="120" r="50" fill="#8b4513" opacity="0.4"/>
  <ellipse cx="150" cy="240" rx="80" ry="100" fill="#8b4513" opacity="0.4"/>
  
  <!-- Question mark -->
  <text x="150" y="340" font-family="'Cinzel', serif" font-size="48" fill="#8b4513" text-anchor="middle" opacity="0.5">?</text>
  
  <!-- Label -->
  <text x="150" y="380" font-family="'Crimson Text', serif" font-size="16" fill="#5c4033" text-anchor="middle">Character Portrait</text>
</svg>
